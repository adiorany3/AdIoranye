name: Code Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run verification scripts
        run: |
          set -euo pipefail
          for script in scripts/verify_*.py; do
            echo "Running $script"
            python "$script"
          done
